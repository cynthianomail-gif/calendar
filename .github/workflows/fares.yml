# 抓到的資料會 commit 回 repo，而不是只留在部署產物裡：
# pages.yml 部署的是 checkout 出來的內容，資料不在 repo 裡的話，
# 下一次任何人 push 都會把票價弄丟。每天一個 commit 是可以接受的代價。
#
# push 之後會觸發 pages.yml 重新部署，所以不需要在這裡自己部署。

name: 抓機票參考價

on:
  schedule:
    # UTC 20:00 = 台灣早上 04:00。夜裡跑，白天打開就是新的。
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fares
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓票價
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "::notice::尚未設定 TRAVELPAYOUTS_TOKEN，略過這次抓取。"
            echo "到 Settings → Secrets and variables → Actions 新增後就會開始運作。"
            exit 0
          fi
          python3 scripts/fetch_fares.py --origin TPE --months 6

      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fares
          if git diff --cached --quiet; then
            echo "票價沒有變動，這次不 commit"
          else
            git commit -m "自動更新機票參考價 $(date -u +%Y-%m-%d)"
            git push
          fi
