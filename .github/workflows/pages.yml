name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/multi-country-calendar-site-fczvbr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild holiday data
        run: |
          python3 scripts/build_holidays.py
          python3 scripts/build_site.py
      # 注意：Pages 必須先由倉庫擁有者在 Settings → Pages 啟用並選擇 GitHub Actions。
      # 試過用 enablement: true 讓 workflow 自己開，但 GITHUB_TOKEN 沒有建立
      # Pages 站台的權限（Resource not accessible by integration），只能手動開一次。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
